<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บอร์ดเกม Review - Tier List</title>
  <link rel="icon"href="test.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
    body { background-color: #f8f9fa; color: #212529; line-height: 1.6; }

    /* Header */
    header { background-color: rgb(128,128,128); color: #fff; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .logo { font-size: 1.5rem; font-weight: 600; color: #ffffff; }
    nav a { color: #fff; text-decoration: none; margin-left: 1.5rem; transition: 0.2s; }
    nav a:hover { color: #ed8936; }

    /* Hero Section */
    .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('avalon.jpg') center/cover; color: #fff; text-align: center; padding: 4rem 1rem; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .hero p { font-size: 1.1rem; margin-bottom: 1.5rem; opacity: 0.9; }

    /* Filter Zone */
    .filter-container { max-width: 1100px; margin: -1.5rem auto 2rem; background: #fff; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .filter-group select { padding: 0.5rem 1rem; border: 1px solid #cbd5e0; border-radius: 6px; background-color: #fff; }

    /* Content & Cards Grid */
    .main-container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
    .section-title { font-size: 1.5rem; margin-bottom: 1rem; border-left: 4px solid #ed8936; padding-left: 0.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }

    .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card-img { width: 100%; height: 180px; object-fit: cover; }
    .card-body { padding: 1.2rem; }
    .badge { background: #feebc8; color: #c05621; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; display: inline-block; margin-bottom: 0.5rem; }
    .card-title { font-size: 1.2rem; margin-bottom: 0.4rem; }
    .card-meta { font-size: 0.85rem; color: #718096; margin-bottom: 0.8rem; }
    .rating { color: #d69e2e; font-weight: 600; margin-bottom: 1rem; }
    .btn { display: block; text-align: center; background: #ed8936; color: #fff; text-decoration: none; padding: 0.5rem; border-radius: 6px; font-weight: 600; }
    .btn:hover { background: #dd6b20; }

    /* Footer */
    footer { background-color: rgb(128,128,128); color: #ffffff; text-align: center; padding: 2rem 1rem; margin-top: 2rem; font-size: 0.9rem; }

    .tier-container {
            width: 100%;
            max-width: 800px;
            background-color: #262626;
            border: 2px solid #3d3d3d;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .tier-row {
            display: flex;
            border-bottom: 2px solid #3d3d3d;
            min-height: 80px;
        }

        .tier-row:last-child {
            border-bottom: none;
        }

        /* ป้ายชื่อ Tier (ซ้ายมือ) */
        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #000;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
            flex-shrink: 0;
        }

        /* สีประจำแต่ละ Tier */
        .tier-s { background-color: #ff7f7f; }
        .tier-a { background-color: #ffbf7f; }
        .tier-b { background-color: #ffdf7f; }
        .tier-c { background-color: #ffff7f; }
        .tier-d { background-color: #bfff7f; }

        /* พื้นที่วางไอเทม (ขวามือ) */
        .tier-dropzone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            align-items: center;
            background-color: #1e1e1e;
        }

        /* คลังเก็บไอเทมเริ่มต้น */
        .item-bank {
            width: 100%;
            max-width: 800px;
            background-color: #262626;
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 100px;
        }

        /* ตัวไอเทมที่ลากได้ */
        .item {
            background-color: #444;
            color: #fff;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: grab;
            user-select: none;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }

        .item:active {
            cursor: grabbing;
        }

        .item:hover {
            background-color: #555;
        }

        /* เอฟเฟกต์ตอนลากมาเหนือนำพื้นที่วาง */
        .tier-dropzone.drag-over, .item-bank.drag-over {
            background-color: #333;
        }
        .imgsmall{
            width: 50px;
            height: 50px;
        }
  </style>
</head>
<body>

  <header>
    <div class="logo">บอร์ดเกม Review</div>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="page2.html">หมวดหมู่</a>
      <a href="page3.html">Tier Lists</a>
      <a href="page4.html">เกี่ยวกับเรา</a>
    </nav>
  </header>

<section class="hero">

  </section>

  <main class="main-container">
    <h2 class="section-title">Tier List</h2>
    
    <div class="tier-container">
        <div class="tier-row">
            <div class="tier-label tier-s">S</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label tier-a">A</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label tier-b">B</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label tier-c">C</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label tier-d">D</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        </div>
    </div>
    
    <!-- คลังเก็บไอเทมเริ่มต้น -->
    <div class="item-bank" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
        <div class="item" id="item1" draggable="true" ondragstart="drag(event)"><img class="imgsmall" src="catan.jpg" alt="boardgame"></div>
        <div class="item" id="item2" draggable="true" ondragstart="drag(event)"><img class="imgsmall" src="ExplodingKittens.jpg" alt="boardgame"></div>
        <div class="item" id="item3" draggable="true" ondragstart="drag(event)"><img class="imgsmall" src="avalon.jpg" alt="boardgame"></div>
        <div class="item" id="item4" draggable="true" ondragstart="drag(event)"><img class="imgsmall" src="boardgame.jpg" alt="boardgame"></div>
        <div class="item" id="item5" draggable="true" ondragstart="drag(event)"><img class="imgsmall" src="Spyfall.jpg" alt="boardgame"></div>
        <div class="item" id="item6" draggable="true" ondragstart="drag(event)"><img class="imgsmall" src="onultwerew.jpg" alt="boardgame"></div>
    </div>

    <script>
        // ฟังก์ชันอนุญาตให้วางไอเทมลงในโซนได้
        function allowDrop(ev) {
            ev.preventDefault();
        }

        // ฟังก์ชันเก็บข้อมูลไอเทมเมื่อเริ่มลาก
        function drag(ev) {
            ev.dataTransfer.setData("text/plain", ev.target.id);
        }

        // ฟังก์ชันทำงานเมื่อไอเทมถูกปล่อยลงในโซน
        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text/plain");
            const draggedElement = document.getElementById(data);
            
            // ลบ Class เอฟเฟกต์สีพื้นหลังตอนลาก
            ev.currentTarget.classList.remove("drag-over");

            // ตรวจสอบว่าเป้าหมายคือโซนรับไอเทม (ไม่ใช่ตัวไอเทมอื่น) แล้วทำการย้ายฝั่ง
            if (ev.currentTarget.classList.contains('tier-dropzone') || ev.currentTarget.classList.contains('item-bank')) {
                ev.currentTarget.appendChild(draggedElement);
            }
        }

        // เอฟเฟกต์เปลี่ยนสีพื้นหลังเมื่อลากไอเทมมาเข้าเขต
        function dragEnter(ev) {
            ev.currentTarget.classList.add("drag-over");
        }

        // เอฟเฟกต์ยกเลิกสีพื้นหลังเมื่อลากไอเทมออกจากเขต
        function dragLeave(ev) {
            ev.currentTarget.classList.remove("drag-over");
        }
    </script>

<!-- Audio Element with Loop attribute -->
<audio id="bg-music" src="IndiHomePaketPhoenix.mp3" loop></audio>

<!-- Custom Play/Pause Button to handle browser autoplay restrictions -->
<button id="music-toggle" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; padding: 10px; cursor: pointer;">
  Play Song
</button>

<script>
  const audio = document.getElementById('bg-music');
  const toggleBtn = document.getElementById('music-toggle');

  // 1. Check and restore previous playback state from localStorage
  const savedTime = localStorage.getItem('musicTime');
  const isPlaying = localStorage.getItem('musicPlaying') === 'true';

  if (savedTime) {
    audio.currentTime = parseFloat(savedTime);
  }

  // 2. Attempt to autoplay if previously playing
  if (isPlaying) {
    audio.play()
      .then(() => {
        toggleBtn.innerText = "Pause Song";
      })
      .catch(error => {
        // Browser blocked autoplay; requires user interaction
        console.log("Autoplay blocked by browser policy. Awaiting user click.");
        toggleBtn.innerText = "Play Song";
      });
  }

  // 3. Play/Pause toggle logic
  toggleBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      toggleBtn.innerText = "Pause Song";
      localStorage.setItem('musicPlaying', 'true');
    } else {
      audio.pause();
      toggleBtn.innerText = "Play Song";
      localStorage.setItem('musicPlaying', 'false');
    }
  });

  // 4. Continuously save the current time before the page changes or reloads
  window.addEventListener('beforeunload', () => {
    localStorage.setItem('musicTime', audio.currentTime);
    localStorage.setItem('musicPlaying', !audio.paused);
  });
</script>


  </main>

  <footer>
    <p>บอร์ดเกม Review</p>
  </footer>

</body>
</html>
